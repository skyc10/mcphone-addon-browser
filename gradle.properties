# ExampleMod tag to use as Blowdryer (Spotless, etc.) settings version, leave empty to disable.
# LOCAL to test local config updates.
gtnh.settings.blowdryerTag = 0.2.2

# Human-readable mod name, available for mcmod.info population.
modName = MCphone Addon Browser

# Case-sensitive identifier string, available for mcmod.info population and used for automatic mixin JSON generation.
# Conventionally lowercase.
modId = mcphone_browser

# Root package of the mod, used to find various classes in other properties,
# mcmod.info substitution, enabling assertions in run tasks, etc.
modGroup = com.november.mcphone.addon.browser

# Whether to use modGroup as the maven publishing group.
# When false, com.github.GTNewHorizons is used.
useModGroupForPublishing = true

# Updates your build.gradle and settings.gradle automatically whenever an update is available.
autoUpdateBuildScript = false

# Version of Minecraft to target
minecraftVersion = 1.7.10

# Version of Minecraft Forge to target
forgeVersion = 10.13.4.1614

# Specify an MCP channel for dependency deobfuscation and the deobfParams task.
channel = stable

# Specify an MCP mappings version for dependency deobfuscation and the deobfParams task.
mappingsVersion = 12

# Defines other MCP mappings for dependency deobfuscation.
remoteMappings = https\://raw.githubusercontent.com/MinecraftForge/FML/1.7.10/conf/

# Select a default username for testing your mod.
developmentEnvironmentUserName = Developer

# Enables modern Java syntax support.
enableModernJavaSyntax = jabel

# If set, ignores the above setting and compiles with the given toolchain.
# forceToolchainVersion = -1

# Enables injecting missing generics into the decompiled source code.
enableGenericInjection = true

# Generate a class with a String field for the mod version named as defined below.
generateGradleTokenClass = com.november.mcphone.addon.browser.Tags

# Name of the token containing the project's current version.
gradleTokenVersion = VERSION

# [DEPRECATED]
replaceGradleTokenInFile =

# In case your mod provides an API for other mods to implement you may declare its package here.
apiPackage =

# Specify the configuration file for Forge's access transformers here.
accessTransformersFile =

# Provides setup for Mixins if enabled.
usesMixins = false

# Set to a non-empty string to configure mixins in a separate source set under src/VALUE.
separateMixinSourceSet =

# Adds some debug arguments like verbose output and class export.
usesMixinDebug = false

# Specify the location of your implementation of IMixinConfigPlugin. Leave it empty otherwise.
mixinPlugin =

# Specify the package that contains all of your Mixins.
mixinsPackage =

# Specify the core mod entry class if you use a core mod.
coreModClass =

# If your project is only a consolidation of mixins or a core mod.
containsMixinsAndOrCoreModOnly = false

# Enables Mixins even if this mod doesn't use them.
forceEnableMixins = false

# If enabled, you may use 'shadowCompile' for dependencies.
usesShadowedDependencies = false

# If disabled, won't remove unused classes from shadowed dependencies.
minimizeShadowedDependencies = true

# If disabled, won't rename the shadowed classes.
relocateShadowedDependencies = true

# Adds CurseMaven, Modrinth, and some more well-known 1.7.10 repositories.
includeWellKnownRepositories = true

# A list of repositories to exclude from the includeWellKnownRepositories setting.
excludeWellKnownRepositories =

# Change these to your Maven coordinates if you want to publish to a custom Maven repository.
usesMavenPublishing = false

# Publishing to Modrinth/CurseForge requires tokens; leave empty.
modrinthProjectId =
modrinthRelations =
curseForgeProjectId =
curseForgeRelations =

# Optional parameter to customize the produced artifacts.
# Preserves artifact naming: mcphone-addon-browser-1.0.0.jar
customArchiveBaseName = mcphone-addon-browser

# Optional parameter to customize the default working directory used by the runClient* tasks.
# runClientWorkingDirectory = run/client

# Uncomment to prevent the source code from being published.
noPublishedSources = true

# Uncomment this to disable Spotless checks.
disableSpotless = true

# Uncomment this to disable Checkstyle checks (currently wildcard import check).
# disableCheckstyle = true

# Override the IDEA build type.
# ideaOverrideBuildType = idea

# Whether IDEA should run spotless checks when pressing the Build button.
ideaCheckSpotlessOnBuild = true

# Non-GTNH properties
org.gradle.configuration-cache = true
org.gradle.parallel = true

# Local proxy for dependency downloads
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.https.nonProxyHosts=localhost|127.0.0.1
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.paths=E:/zcode/jdks/jdk-25.0.4.1+1,E:/zcode/jdks/zulu17.68.203-ca-jdk17.0.20.1-win_x64,E:/zcode/jdks/zulu8.96.0.205-ca-jdk8.0.504-win_x64,E:/zcode/jdks/zulu21.52.203-ca-jdk21.0.12.1-win_x64
version = 1.0.0
